<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>法朵內褲尺寸挑選攻略</title>
    <!-- 引入 html2canvas 截圖功能 -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --main-color: #d67d7d;
            --main-color-hover: #c06060;
            --bg-color: #fdf2f5;
            --box-bg: #fff8f8;
            --border-color: #f0d0d0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: #444;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            position: relative;
            min-height: 550px;
            display: flex;
            flex-direction: column;
        }
        
        /* --- 進度條樣式 --- */
        .progress-container {
            display: none;
            justify-content: space-between;
            align-items: center;
            position: relative;
            margin-bottom: 30px;
            padding: 0 5px;
        }
        .progress-line-bg {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            height: 3px;
            background-color: #eee;
            z-index: 0;
        }
        .progress-line-fill {
            position: absolute;
            top: 15px;
            left: 20px;
            height: 3px;
            background-color: var(--main-color);
            z-index: 0;
            width: 0%;
            transition: width 0.4s ease;
        }
        .step-circle-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }
        .step-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #eee;
            color: #999;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.4s;
        }
        .step-circle.active {
            background-color: var(--main-color);
            color: white;
            box-shadow: 0 0 0 4px var(--bg-color);
        }
        .step-label {
            font-size: 12px;
            color: #999;
            margin-top: 6px;
            white-space: nowrap;
        }
        .step-circle.active + .step-label {
            color: var(--main-color);
            font-weight: bold;
        }

        /* --- 一般樣式 --- */
        h2 {
            color: var(--main-color);
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .welcome-title {
            font-size: 26px;
            color: var(--main-color);
            margin-bottom: 30px;
            line-height: 1.4;
        }
        
        .step {
            display: none;
            flex-grow: 1;
            flex-direction: column;
        }
        .step.active {
            display: flex;
            animation: fadeIn 0.4s ease-out;
        }
        
        #welcome-screen {
            justify-content: center;
            align-items: center;
            text-align: center;
            height: 100%;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
            text-align: left;
            width: 100%;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #eee;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }
        
        /* 按鈕樣式 */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            width: 100%;
        }
        button {
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        button.primary-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--main-color);
            color: white;
            font-size: 18px;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(214, 125, 125, 0.2);
        }
        button.primary-btn:hover {
            background-color: var(--main-color-hover);
            transform: translateY(-1px);
        }
        button.secondary-btn {
            width: 100%;
            padding: 12px;
            background-color: #f0f0f0;
            color: #666;
            font-size: 14px;
        }
        button.outline-btn {
            width: 100%;
            padding: 12px;
            background-color: white;
            color: var(--main-color);
            border: 2px solid var(--main-color);
            font-size: 16px;
            margin-bottom: 10px;
        }
        
        button.screenshot-btn {
            background: #fff0f0;
            border: 1px solid var(--main-color);
            color: var(--main-color);
            padding: 8px 15px;
            font-size: 13px;
            border-radius: 20px;
            margin-top: 15px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            justify-content: center;
            transition: 0.3s;
        }
        button.screenshot-btn:hover {
            background: var(--main-color);
            color: white;
        }

        button.line-btn {
            width: 100%;
            padding: 14px;
            background-color: #06c755;
            color: white;
            font-size: 16px;
            margin-top: 10px;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(6, 199, 85, 0.2);
        }
        button.line-btn:hover {
            background-color: #05b34c;
        }

        /* 喜好選擇按鈕 */
        .pref-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
        }
        .pref-btn {
            flex: 1;
            padding: 15px;
            border: 2px solid #eee;
            border-radius: 10px;
            background: white;
            color: #666;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }
        .pref-btn.selected {
            border-color: var(--main-color);
            background-color: #fff0f0;
            color: var(--main-color);
            font-weight: bold;
        }

        /* 導購選單 */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
            width: 100%;
        }
        .menu-item {
            padding: 15px 5px;
            background: var(--box-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            text-align: center;
            color: var(--main-color);
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .menu-item:hover {
            background: var(--main-color);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(214, 125, 125, 0.3);
        }
        .menu-icon {
            font-size: 20px;
            margin-bottom: 5px;
        }

        /* 資訊框與提示 */
        .info-box {
            background-color: var(--box-bg);
            border-left: 4px solid var(--main-color);
            padding: 15px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #666;
            line-height: 1.6;
            text-align: left;
            width: 100%;
            box-sizing: border-box;
        }
        .care-box {
            background-color: #f4f4f4;
            color: #666;
            font-size: 12px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-top: 15px;
            margin-bottom: 15px;
            line-height: 1.5;
            width: 100%;
            box-sizing: border-box;
        }
        
        /* 截圖卡片區域 */
        .result-box {
            text-align: center;
            padding: 20px 10px;
            border: 2px dashed var(--main-color);
            border-radius: 15px;
            margin-top: 0;
            margin-bottom: 15px;
            position: relative;
            width: 100%;
            box-sizing: border-box;
            background: white;
        }
        
        .user-data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 5px;
            background: #fffbfb;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid #fce8e8;
        }
        .data-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .data-label {
            font-size: 11px;
            color: #999;
            margin-bottom: 2px;
        }
        .data-value {
            font-size: 16px;
            font-weight: bold;
            color: #555;
        }
        
        .result-size {
            font-size: 48px;
            color: var(--main-color);
            font-weight: bold;
            margin: 5px 0;
            line-height: 1;
        }
        .tag {
            display: inline-block;
            background: #eee;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 5px;
            color: #555;
        }
        .note {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
            text-align: center;
        }

        /* 圖片預覽 Modal */
        #imageModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #imageModal.show {
            display: flex;
            opacity: 1;
        }
        #imageModal img {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            /* 防止點擊圖片穿透關閉視窗 */
            pointer-events: auto; 
        }
        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 30px;
            cursor: pointer;
            z-index: 10000;
            padding: 10px;
        }
        .modal-tip {
            color: white;
            margin-top: 15px;
            font-size: 14px;
            background: rgba(255,255,255,0.2);
            padding: 8px 15px;
            border-radius: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- 進度條 -->
    <div class="progress-container" id="progressBar">
        <div class="progress-line-bg"></div>
        <div class="progress-line-fill" id="progressLine"></div>
        <div class="step-circle-wrapper">
            <div class="step-circle" id="circle1">1</div>
            <div class="step-label">基本資料</div>
        </div>
        <div class="step-circle-wrapper">
            <div class="step-circle" id="circle2">2</div>
            <div class="step-label">身形測量</div>
        </div>
        <div class="step-circle-wrapper">
            <div class="step-circle" id="circle3">3</div>
            <div class="step-label">建議尺寸</div>
        </div>
    </div>

    <!-- 步驟 0: 歡迎頁面 -->
    <div id="welcome-screen" class="step active">
        <div class="welcome-title">歡迎使用<br><b>法朵內褲尺寸測量攻略</b></div>
        <div style="font-size: 60px; margin-bottom: 20px;">📏</div>
        <button class="primary-btn" onclick="startApp()">開始測量</button>
        <div class="info-box" style="margin-top: 20px; font-size: 12px;">
            💡 系統會自動記憶您的測量數據，不怕跳出網頁需要重新填寫喔！
        </div>
    </div>

    <!-- 步驟 1: 身高體重 -->
    <div id="step1" class="step">
        <h2 id="mainTitle">輸入基本資料</h2>
        <label>您的身高 (cm)</label>
        <input type="number" id="height" placeholder="例如：160">
        
        <label>您的體重 (kg)</label>
        <input type="number" id="weight" placeholder="例如：55">
        
        <button class="primary-btn" onclick="nextStep(1)">下一步</button>
    </div>

    <!-- 步驟 2: 臀圍與喜好 -->
    <div id="step2" class="step">
        <h2 id="mainTitle">身形與偏好</h2>
        <div class="info-box">
            <strong>💡 臀圍測量方法：</strong><br>拿出皮尺測量臀部最寬的部分。<br>如沒有皮尺也可以用繩子測量紀錄，再用直尺測量長度即可。
        </div>

        <label>您的臀圍 (cm)</label>
        <input type="number" id="hip" placeholder="輸入臀圍公分數 (若不知道可留空)">

        <label>您喜歡的穿著感受？(必選)</label>
        <div class="pref-container">
            <div class="pref-btn" id="pref-tight" onclick="selectPref('tight')">貼身包覆<br><span style="font-size:12px">(喜歡剛好)</span></div>
            <div class="pref-btn" id="pref-loose" onclick="selectPref('loose')">舒適寬鬆<br><span style="font-size:12px">(不愛勒痕)</span></div>
        </div>

        <button class="primary-btn" onclick="calculateSize(true)">輸入好臀圍了，計算尺寸</button>
        <button class="secondary-btn" onclick="calculateSize(false)">不知道臀圍 (僅用身高體重推算)</button>
    </div>

    <!-- 步驟 3: 結果顯示 -->
    <div id="result" class="step">
        <h2 id="mainTitle">您的建議尺寸</h2>
        <div class="result-box" id="captureArea">
            <div class="user-data-grid">
                <div class="data-item"><span class="data-label">身高</span><span class="data-value" id="dispHeight">--</span></div>
                <div class="data-item"><span class="data-label">體重</span><span class="data-value" id="dispWeight">--</span></div>
                <div class="data-item"><span class="data-label">臀圍</span><span class="data-value" id="dispHip">--</span></div>
            </div>
            <div class="tag" id="prefTag"></div>
            <div>根據數據，建議尺寸為</div>
            <div class="result-size" id="recommendedSize">L</div>
            <div id="resultDetail" style="color: #666; font-size: 13px; margin-bottom: 8px;"></div>
            <button class="screenshot-btn" id="dlBtn" onclick="generateAndShowImage()">📸 下載尺寸小卡</button>
        </div>
        
        <div class="info-box" id="fittingNote" style="margin-bottom: 10px;"></div>

        <button class="primary-btn" onclick="showRecommendations()">繼續推薦合適產品</button>
        <button class="line-btn" onclick="window.open(APP_CONFIG.links.lineSupport, '_blank')">💬 有疑問？加入 LINE 客服諮詢</button>
        <button class="secondary-btn" onclick="resetApp()">清除紀錄並重新測量</button>
    </div>

    <!-- 導購主選單 -->
    <div id="promo-main" class="step">
        <h2 id="mainTitle">為您推薦</h2>
        <label style="text-align:center; font-size:18px;">請問您想找哪種類型的內褲？</label>
        <div class="menu-grid" id="menuGrid">
            <!-- 透過 JS 動態生成主選單 -->
        </div>
        <br>
        <button class="secondary-btn" onclick="backToResult()">回上一頁</button>
    </div>

    <!-- 子分類選單 -->
    <div id="promo-sub" class="step">
        <h2 id="mainTitle">商品分類</h2>
        <label id="subTitle" style="text-align:center; font-size:18px; margin-bottom:15px;"></label>
        <div id="subButtonsContainer"></div>
        <br>
        <button class="secondary-btn" onclick="showRecommendations()">回分類選單</button>
    </div>

</div>

<!-- 圖片預覽 Modal (加入點擊穿透保護) -->
<div id="imageModal" onclick="closeImageModal(event)">
    <div class="modal-close">×</div>
    <img id="generatedImage" src="" alt="尺寸小卡" onclick="event.stopPropagation()">
    <div class="modal-tip">👆 請長按圖片即可儲存至手機相簿</div>
</div>

<script>
    // ==========================================
    // ⚙️ 系統設定區 (演算法與商品連結集中管理)
    // ==========================================
    const APP_CONFIG = {
        // --- 1. 商品導購連結庫 ---
        links: {
            lineSupport: "https://lin.ee/4WoBo0r",
            cottonCandy: "https://www.faduobra.com/v2/official/SalePageCategory/514005?sortMode=Curator",
            categories: {
                shape: [
                    { name: "🤰 我有小腹 (收腹款)", url: "https://www.faduobra.com/SalePage/Index/10028317" },
                    { name: "🍑 我有馬鞍肉 (修飾款)", url: "https://www.faduobra.com/SalePage/Index/11098260" }
                ],
                material: [
                    { name: "🍃 涼爽透氣", url: "https://www.faduobra.com/v2/official/SalePageCategory/520439" },
                    { name: "🛡️ 安鋅抗菌", url: "https://www.faduobra.com/v2/official/SalePageCategory/491112" },
                    { name: "✨ 無痕系列", url: "https://www.faduobra.com/v2/official/SalePageCategory/491114" }
                ],
                cut: [
                    { name: "低腰版型", url: "https://www.faduobra.com/v2/official/SalePageCategory/491117" },
                    { name: "中腰版型", url: "https://www.faduobra.com/v2/official/SalePageCategory/491118" },
                    { name: "高腰版型", url: "https://www.faduobra.com/v2/official/SalePageCategory/491119" }
                ],
                habit: [
                    { name: "💨 想改善悶熱", url: "https://www.faduobra.com/v2/official/SalePageCategory/520439" },
                    { name: "🩺 想改善婦科問題", url: "https://www.faduobra.com/v2/official/SalePageCategory/542708" },
                    { name: "☁️ 改善摩擦異物感", url: "https://www.faduobra.com/v2/official/SalePageCategory/512377" }
                ]
            }
        },
        
        // --- 2. 演算法參數 (尺寸交界點) ---
        rules: {
            hip: {
                limitM: 81,  // 小於等於此值為M
                edgeML: 92,  // M與L的交界點
                edgeLXL: 98, // L與XL的交界點
                edgeXL2XL: 105, // XL與2XL的交界點
                edge2XL3XL: 115, // 2XL與3XL的交界點
                max3XL: 125 // 超過此值皆為3XL
            },
            weight: {
                limitM: 50,
                edgeML: 55,
                limitL: 60,
                edgeLXL: 62,
                limitXL: 72,
                edgeXL2XL: 73, // 72以下XL, 73看喜好, 74以上2XL
                limit2XL: 81   // 81以上皆為3XL
            }
        }
    };

    // ==========================================
    // 🧠 核心邏輯區
    // ==========================================
    const STORAGE_KEY = 'fadou_user_data_v1';
    let userData = {
        height: '',
        weight: '',
        hip: '',
        preference: ''
    };

    // --- 用戶記憶 (Local Storage) ---
    function loadSavedData() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            userData = JSON.parse(saved);
            if (userData.height) document.getElementById('height').value = userData.height;
            if (userData.weight) document.getElementById('weight').value = userData.weight;
            if (userData.hip) document.getElementById('hip').value = userData.hip;
            if (userData.preference) selectPref(userData.preference);
        }
    }

    function saveDataToLocal() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(userData));
    }

    function resetApp() {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
    }

    // 啟動時讀取資料
    window.onload = function() {
        loadSavedData();
        buildMainMenu();
    };

    // --- UI 流程控制 ---
    function updateProgressBar(step) {
        const barContainer = document.getElementById('progressBar');
        const line = document.getElementById('progressLine');
        ['circle1', 'circle2', 'circle3'].forEach((id, idx) => {
            document.getElementById(id).classList.toggle('active', step > idx);
        });
        barContainer.style.display = (step === 0) ? 'none' : 'flex';
        line.style.width = step === 1 ? '0%' : step === 2 ? '50%' : step === 3 ? '100%' : '0%';
    }

    function switchStep(from, to) {
        document.getElementById(from).classList.remove('active');
        document.getElementById(to).classList.add('active');
    }

    function startApp() {
        switchStep('welcome-screen', 'step1');
        updateProgressBar(1);
    }

    function nextStep(currentStep) {
        if (currentStep === 1) {
            const h = document.getElementById('height').value;
            const w = document.getElementById('weight').value;
            if (!h || !w || h <= 0 || w <= 0) {
                alert("請輸入正確的身高與體重數值！");
                return;
            }
            userData.height = parseInt(h);
            userData.weight = parseInt(w);
            saveDataToLocal(); // 儲存進度
            switchStep('step1', 'step2');
            updateProgressBar(2);
        }
    }

    function selectPref(type) {
        userData.preference = type;
        document.getElementById('pref-tight').classList.remove('selected');
        document.getElementById('pref-loose').classList.remove('selected');
        document.getElementById('pref-' + type).classList.add('selected');
        saveDataToLocal(); // 儲存偏好
    }

    // --- 演算法計算 ---
    function calculateSize(hasHipData) {
        if (!userData.preference) {
            alert("請選擇您喜歡「貼身包覆」還是「舒適寬鬆」！");
            return;
        }

        const R = APP_CONFIG.rules; // 取出設定檔參數
        let finalSize = '';
        let message = '';
        let note = '';
        const prefText = userData.preference === 'tight' ? '喜歡合身' : '喜歡寬鬆';
        
        document.getElementById('prefTag').innerText = `偏好：${prefText}`;
        document.getElementById('dispHeight').innerText = userData.height + 'cm';
        document.getElementById('dispWeight').innerText = userData.weight + 'kg';

        if (hasHipData) {
            const hip = parseInt(document.getElementById('hip').value);
            if (!hip || hip <= 0) return alert("請輸入正確的臀圍數字");
            
            userData.hip = hip;
            saveDataToLocal();
            document.getElementById('dispHip').innerText = hip + 'cm';

            // 依據設定檔進行臀圍判斷
            if (hip <= R.hip.limitM) {
                finalSize = 'M'; note = '依據臀圍，M 號對您來說是合適的尺寸。';
            } else if (hip <= R.hip.edgeML) {
                if (hip === R.hip.edgeML) {
                    finalSize = 'L'; note = `臀圍處於 M/L 交界，因您${prefText}，建議選擇 L 號${userData.preference==='tight'?'會有較好包覆感':'較為舒適'}。`;
                } else {
                    finalSize = 'M'; note = '依據臀圍，M 號是您的最佳選擇。';
                }
            } else if (hip <= R.hip.edgeLXL) {
                if (hip === R.hip.edgeLXL) {
                    finalSize = userData.preference === 'tight' ? 'L' : 'XL';
                    note = `臀圍處於 L/XL 交界，因您${prefText}，建議選擇 ${finalSize} 號。`;
                } else {
                    finalSize = 'L'; note = '依據臀圍，L 號對您來說很合適。';
                }
            } else if (hip <= R.hip.edgeXL2XL) {
                if (hip === R.hip.edgeXL2XL) {
                    finalSize = 'XXL'; note = `臀圍處於 XL/2XL 交界，建議選擇 2XL 號避免卡臀。`;
                } else {
                    finalSize = 'XL'; note = 'XL 號的彈性範圍非常適合您的身形。';
                }
            } else if (hip <= R.hip.edge2XL3XL) {
                if (hip === R.hip.edge2XL3XL) {
                    finalSize = 'XXXL'; note = `臀圍處於 2XL/3XL 交界，建議選擇 3XL 號較為舒適。`;
                } else {
                    finalSize = 'XXL'; note = '2XL 號能提供您足夠的包覆與舒適度。';
                }
            } else {
                finalSize = 'XXXL'; note = '建議選擇 3XL 號，其彈性佳能提供舒適穿著感。';
            }
            message = `依據臀圍 (${hip}cm) 判斷`;

        } else {
            const w = userData.weight;
            document.getElementById('dispHip').innerText = "未測量";
            userData.hip = '';
            saveDataToLocal();
            
            // 依據設定檔進行體重判斷
            if (w <= R.weight.limitM) finalSize = 'M';
            else if (w <= R.weight.edgeML) finalSize = userData.preference === 'tight' ? 'M' : 'L';
            else if (w <= R.weight.limitL) finalSize = 'L';
            else if (w <= R.weight.edgeLXL) finalSize = 'XL';
            else if (w <= R.weight.limitXL) finalSize = 'XL';
            else if (w <= R.weight.edgeXL2XL) finalSize = userData.preference === 'tight' ? 'XL' : 'XXL';
            else if (w <= R.weight.limit2XL) finalSize = 'XXL';
            else finalSize = 'XXXL';

            message = `依據體重推算 (建議測量臀圍更準確)`;
            note = `系統依據體重 (${w}kg) 進行評估。若您屬於下半身較豐腴的身形，建議參考臀圍數據會更準確。`;
        }

        document.getElementById('recommendedSize').innerText = finalSize;
        document.getElementById('resultDetail').innerText = message;
        document.getElementById('fittingNote').innerText = note;
        switchStep('step2', 'result');
        updateProgressBar(3);
    }

    // --- 導購選單與截圖功能 ---
    function buildMainMenu() {
        const grid = document.getElementById('menuGrid');
        grid.innerHTML = `
            <div class="menu-item" onclick="showSubCategory('shape')"><div class="menu-icon">💃</div>身形修飾</div>
            <div class="menu-item" onclick="showSubCategory('material')"><div class="menu-icon">🍃</div>以材質區分</div>
            <div class="menu-item" onclick="showSubCategory('cut')"><div class="menu-icon">✂️</div>以版型區分</div>
            <div class="menu-item" onclick="showSubCategory('habit')"><div class="menu-icon">❤️</div>解決困擾</div>
            <div class="menu-item" style="grid-column: span 2;" onclick="window.open(APP_CONFIG.links.cottonCandy, '_blank')">
                <div class="menu-icon">🌸</div>棉花糖女孩專區
            </div>
        `;
    }

    function showRecommendations() {
        document.getElementById('result').classList.remove('active');
        document.getElementById('promo-sub').classList.remove('active');
        document.getElementById('promo-main').classList.add('active');
        updateProgressBar(0);
    }

    function backToResult() {
        switchStep('promo-main', 'result');
        updateProgressBar(3);
    }

    function showSubCategory(type) {
        const container = document.getElementById('subButtonsContainer');
        container.innerHTML = ''; 
        const titles = { shape: '修飾身形困擾', material: '偏好材質', cut: '喜歡的版型', habit: '想解決的困擾' };
        document.getElementById('subTitle').innerText = titles[type];

        APP_CONFIG.links.categories[type].forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'outline-btn';
            btn.innerText = item.name;
            btn.onclick = () => window.open(item.url, '_blank');
            container.appendChild(btn);
        });
        switchStep('promo-main', 'promo-sub');
    }

    function generateAndShowImage() {
        const element = document.getElementById("captureArea");
        const btn = document.getElementById("dlBtn");
        const originalText = btn.innerHTML;
        btn.innerHTML = "生成中...";

        // 加入微延遲確保渲染完成
        setTimeout(() => {
            html2canvas(element, {
                scale: 2,
                backgroundColor: "#ffffff",
                onclone: (doc) => doc.getElementById('dlBtn').style.display = 'none'
            }).then(canvas => {
                document.getElementById('generatedImage').src = canvas.toDataURL("image/png");
                document.getElementById('imageModal').classList.add('show');
                btn.innerHTML = originalText;
            }).catch(err => {
                alert("圖片生成失敗，請稍後再試！");
                btn.innerHTML = originalText;
            });
        }, 150);
    }

    function closeImageModal(e) {
        // 只在點擊背景或關閉按鈕時觸發，點擊圖片本身不會觸發
        if (e.target.id === 'imageModal' || e.target.classList.contains('modal-close')) {
            document.getElementById('imageModal').classList.remove('show');
        }
    }
</script>
